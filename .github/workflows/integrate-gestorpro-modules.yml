name: Integrar módulos GestorPro

on:
  push:
    branches: [main]
    paths:
      - 'client-v3-enhancement.js'
      - 'servers-v4-enhancement.js'
      - 'finance-v5-enhancement.js'
      - 'billing-v6-enhancement.js'
      - 'reports-v7-enhancement.js'
      - 'backup-v8-enhancement.js'
      - 'settings-v9-enhancement.js'
      - 'gestorpro-integration-v10.js'
      - 'gestorpro-persistence-v14.js'
      - '.github/workflows/integrate-gestorpro-modules.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar scripts no index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          files = [
              'gestorpro-persistence-v14.js',
              'client-v3-enhancement.js',
              'servers-v4-enhancement.js',
              'finance-v5-enhancement.js',
              'billing-v6-enhancement.js',
              'reports-v7-enhancement.js',
              'backup-v8-enhancement.js',
              'settings-v9-enhancement.js',
              'gestorpro-integration-v10.js',
          ]
          marker = '<!-- GESTORPRO_MODULES -->'
          block = marker + '\n' + '\n'.join(f'<script src="{f}"></script>' for f in files) + '\n'
          if marker not in text:
              if '</body>' in text:
                  text = text.replace('</body>', block + '</body>', 1)
              elif '</html>' in text:
                  text = text.replace('</html>', block + '</html>', 1)
              else:
                  text += '\n' + block
          else:
              start = text.index(marker)
              next_body = text.find('</body>', start)
              if next_body == -1:
                  next_body = text.find('</html>', start)
              if next_body == -1:
                  next_body = len(text)
              text = text[:start] + block + text[next_body:]
          p.write_text(text, encoding='utf-8')

          # Falhar o job se a persistência não tiver sido realmente inserida.
          final = p.read_text(encoding='utf-8')
          required = '<script src="gestorpro-persistence-v14.js"></script>'
          if required not in final:
              raise SystemExit('ERRO: gestorpro-persistence-v14.js não foi integrado ao index.html')

      - name: Commitar integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
          else
            git commit -m 'feat: integrar persistência Supabase ao painel principal'
            git push
          fi